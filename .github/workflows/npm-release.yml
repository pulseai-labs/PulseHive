name: npm Release

on:
  push:
    tags:
      - "v*"
  # The spine's pull request carries per-target install evidence: build and
  # verify-install run on PRs that touch the JS package or this workflow, while
  # publish stays tag-only by its own `if:`.
  pull_request:
    paths:
      - "pulsehive-js/**"
      - ".github/workflows/npm-release.yml"
  workflow_dispatch:

permissions:
  contents: read

# One npm release at a time per ref, queued rather than cancelled: an
# interrupted publish would leave a partial release that only the resume path
# could finish (A14).
concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The release gate every publish path must wait on: the manifest/tag check,
  # the on-main check, then all of ci.yml (A2). A tag that does not name the
  # manifest version, or that is not on main, never reaches the registry.
  gate:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/release-gate.yml

  build-binaries:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15 (not macos-latest): macos-latest now defaults to Xcode 26,
          # whose relocated clang_rt.osx breaks rustc linking. macos-15 ships a
          # pre-26 Xcode; the step below pins the compiler via DEVELOPER_DIR.
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macOS-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: Linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: Windows-x86_64

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          # Bumped to avoid restoring a macOS cache that hardcodes a stale
          # Xcode 26.x clang_rt.osx path (see the DEVELOPER_DIR step below).
          prefix-key: "v2-rust"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Install OpenSSL dev headers on Linux (needed by reqwest/native-tls)
      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Install npm deps
        working-directory: pulsehive-js
        run: npm ci

      # Pin the compiler to a pre-26 Xcode via DEVELOPER_DIR (which OVERRIDES
      # xcode-select). Xcode 26 relocated clang_rt.osx and breaks rustc linking.
      - name: Use a pre-26 Xcode (avoid Xcode 26 clang_rt.osx linker break)
        if: runner.os == 'macOS'
        run: |
          sel=""
          for v in 16.4 16.3 16.2 16.1 16.0 15.4 15.2; do
            if [ -d "/Applications/Xcode_$v.app" ]; then sel="/Applications/Xcode_$v.app/Contents/Developer"; break; fi
          done
          if [ -z "$sel" ]; then
            echo "::error::No pre-26 Xcode found on this runner. Installed Xcodes:"
            ls -d /Applications/Xcode_*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select -s "$sel"
          echo "DEVELOPER_DIR=$sel" >> "$GITHUB_ENV"
          echo "Using Xcode: $sel"

      # Wrapped in a retry loop to absorb a flaky upstream build dependency:
      # the `ort-sys` build script (pulled transitively via pulsehive-db's
      # builtin-embeddings -> ort / ONNX Runtime) downloads a prebuilt binary
      # from cdn.pyke.io, which intermittently returns HTTP 403 (rate-limit /
      # transient). That was breaking the Linux binary build. Retrying rides
      # over the transient failure. A durable upstream fix (pin the ONNX
      # Runtime lib or switch ort to load-dynamic in pulsehive-db) would remove
      # the need for this. See the release-ops "Known fragility" notes.
      - name: Build native addon (retry to absorb flaky ort-sys CDN 403)
        working-directory: pulsehive-js
        shell: bash
        run: |
          set -uo pipefail
          attempt=0
          max=3
          until [ "$attempt" -ge "$max" ]; do
            if npx napi build --platform --release --features napi --target ${{ matrix.target }}; then
              exit 0
            fi
            attempt=$((attempt + 1))
            echo "napi build failed (attempt $attempt/$max) — likely a transient ort-sys cdn.pyke.io 403; retrying in 20s..."
            sleep 20
          done
          echo "::error::napi build failed after $max attempts"
          exit 1

      - name: Upload binary and generated loader
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.platform }}
          # Both entries of `files` that only `napi build` produces travel with the
          # artifact. They are platform-independent, so any of the three legs may
          # supply them, and `pack` — which never runs `napi build` — needs them:
          # `npm pack` exits 0 while silently omitting a missing `files` entry, so
          # without this the published main tarball would have no loader at all.
          path: |
            pulsehive-js/pulsehive-js.*.node
            pulsehive-js/index.js
            pulsehive-js/index.d.ts

  # The only place npm tarballs are produced. The publish job downloads what this
  # job uploaded, so the bytes that reach the registry are the bytes `verify-install`
  # installed and executed — the artifact-identity rule in RELEASE.md.
  pack:
    name: Pack npm tarballs
    needs: [build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # One directory per artifact, so a binary can never be silently replaced by
      # another platform's upload. pack-npm.sh searches this tree recursively and
      # refuses a set that does not match the advertised targets exactly.
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: pulsehive-js/artifacts
          pattern: binary-*

      - name: Install deps and pack publishable tarballs
        working-directory: pulsehive-js
        run: |
          npm ci
          bash scripts/pack-npm.sh --artifacts artifacts --targets all --out dist-npm

      # A16: the pre-approval inventory — exactly which bytes this run will
      # publish, readable in the job summary before the `npm` environment's
      # review. Fails closed if a tarball cannot be read, before the artifact is
      # uploaded.
      - name: Write the pre-approval tarball inventory to the job summary
        working-directory: pulsehive-js
        run: |
          set -euo pipefail
          {
            echo "### npm tarball inventory (pre-approval)"
            echo
            echo "| tarball | package | version | sha512 integrity |"
            echo "|---|---|---|---|"
            for tarball in dist-npm/*.tgz; do
              meta="$(tar -xzOf "$tarball" package/package.json | node -e '
                let raw = "";
                process.stdin.on("data", (chunk) => (raw += chunk));
                process.stdin.on("end", () => {
                  const pkg = JSON.parse(raw);
                  process.stdout.write(pkg.name + "\t" + pkg.version);
                });
              ')"
              integrity="$(node -e '
                const crypto = require("crypto");
                const fs = require("fs");
                process.stdout.write(
                  "sha512-" + crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"),
                );
              ' "$tarball")"
              echo "| $(basename "$tarball") | ${meta%%$'\t'*} | ${meta#*$'\t'} | $integrity |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload packed tarballs
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarballs
          path: pulsehive-js/dist-npm/*.tgz
          if-no-files-found: error
          # L4 narrowed: the tested artifacts are what a re-run of the failed
          # jobs publishes, so they outlive the default retention window.
          retention-days: 90

  # Every advertised target installs the packed tarballs on its own runner, on every
  # advertised Node line, and calls a binding. "Installed and executed, not merely
  # counted" (RELEASE.md): matching artifact names against target names would bless a
  # mislabelled or unloadable binary.
  verify-install:
    name: Verify install (${{ matrix.platform }} · node ${{ matrix.node }})
    needs: pack
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The advertised matrix (ADR-015 A1) is exactly napi.targets: each of the
        # three targets that gets a platform package is installed and executed on
        # its own runner, on both advertised Node lines.
        os: [macos-15, ubuntu-latest, windows-latest]
        node: ["22", "24"]
        include:
          - os: macos-15
            platform: darwin-arm64
          - os: ubuntu-latest
            platform: linux-x64-gnu
          - os: windows-latest
            platform: win32-x64-msvc
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Download the packed tarballs
        uses: actions/download-artifact@v4
        with:
          name: npm-tarballs
          path: tarballs

      # The consumer tree is deliberately outside the package tree and has no
      # checkout: this proves the tarballs are installable on their own, with no
      # Rust toolchain and no source build. `--omit=optional` keeps the install
      # hermetic — the host platform package arrives as an explicit local tarball
      # rather than being resolved against a registry that, on the first publish,
      # does not have it yet. The registry-resolution proof is w3's.
      - name: Install the host platform + main tarballs and call a binding
        shell: bash
        run: |
          set -euo pipefail
          rm -rf consumer
          mkdir -p consumer
          cd consumer
          npm init -y >/dev/null
          platform_tarball="$(ls ../tarballs/pulsehive-sdk-${{ matrix.platform }}-[0-9]*.tgz | head -n1)"
          main_tarball="$(ls ../tarballs/pulsehive-sdk-[0-9]*.tgz | head -n1)"
          npm install --no-audit --no-fund --omit=optional "$platform_tarball" "$main_tarball"
          node -e '
            const os = require("os");
            const path = require("path");
            const sdk = require("@pulsehive/sdk");
            if (typeof sdk.version !== "function" || sdk.version().length === 0) {
              throw new Error("@pulsehive/sdk exposed no version() binding");
            }
            const substrate = path.join(
              os.tmpdir(),
              `pulsehive-verify-install-${process.pid}.db`,
            );
            const hive = sdk.HiveMind.builder().substratePath(substrate).build();
            hive.shutdown();
            console.log(
              `per-target install: ok ${{ matrix.platform }} node ${process.version}`,
            );
          '

  publish:
    name: Publish to npm
    needs: [gate, verify-install]
    runs-on: ubuntu-latest
    environment: npm
    # Tag runs only — a PR and a branch dispatch never reach the registry. A
    # dispatch on a `v*` tag does reach it, because GitHub's re-run window
    # expires and that is the documented recovery for a partial publish (L4).
    if: startsWith(github.ref, 'refs/tags/v')
    # Gated by the `npm` deployment environment (above), which has a required
    # reviewer — publish waits for manual approval. NPM_TOKEN is provisioned
    # in that environment (see the release runbook).
    steps:
      # The gated publish path is a tracked script; the job needs the tree for
      # `pulsehive-js/scripts/npm-publish.sh` and `scripts/release-check.sh`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # The published bytes are the verified bytes: the tarballs `pack` produced and
      # `verify-install` installed and executed on every advertised target. Nothing
      # is re-packed and nothing is built in this job.
      - name: Download the verified tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-tarballs
          path: dist-npm

      # One invocation of the gated publish path. It validates the tarball set,
      # decides per package against npm's published integrity — an identical
      # version is skipped, a different one refuses and stops — publishes the
      # platform packages first and the main package last, and re-reads every
      # published integrity (L4; #100). A missing NODE_AUTH_TOKEN fails the run
      # inside the script instead of warning and exiting 0 (A4). NPM_TOKEN is
      # scoped to this step alone (ADR-006).
      - name: Publish to npm
        shell: bash
        run: |
          set -o pipefail
          args=(--dist dist-npm --expect-version "$(bash scripts/release-check.sh --get npm.version)")
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            args+=(--fresh-build)
          fi
          bash pulsehive-js/scripts/npm-publish.sh publish "${args[@]}" 2>&1 \
            | tee "$RUNNER_TEMP/npm-publish.log"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # A9/A16: the per-package outcome lines go to the job summary from the
      # teed log, and this step runs even when the publish step refused. The
      # job's own exit status stays the publish step's.
      - name: Write the npm publish outcome to the job summary
        if: always()
        shell: bash
        run: |
          log="$RUNNER_TEMP/npm-publish.log"
          {
            echo "### npm publish outcome"
            echo
            echo '```'
            if [ -f "$log" ]; then
              cat "$log"
            else
              echo "npm-publish.sh produced no output"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
