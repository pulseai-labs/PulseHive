[package]
name = "pulsehive-core"
version = "3.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core traits and types for PulseHive multi-agent SDK"
readme = "README.md"
homepage = "https://github.com/pulseai-labs/PulseHive"
documentation = "https://docs.rs/pulsehive-core"
keywords = ["ai", "agent", "llm", "traits", "sdk"]
categories = ["science", "asynchronous"]

[package.metadata.docs.rs]
all-features = true

[features]
testing = []
substrate = ["dep:pulsehive-db"]

[dependencies]
pulsehive-db = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
uuid = { workspace = true }
futures-core = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
pulsehive-db = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }

[[test]]
name = "scripted_provider"
required-features = ["testing"]
